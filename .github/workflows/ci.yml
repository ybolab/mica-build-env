name: ci
# The quality gates on every push and pull request. Publishes nothing.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every IMAGE_ key is a digest pin
        run: bash from.sh --check
      - name: Image inputs and the release refusals
        run: bash tests/publish-test.sh
      - name: Workflows
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:latest
